<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sanly Shop | Elite Tech Store{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <div class="container d-flex align-items-center justify-content-between py-3">
            <h1 class="h2 mb-0 text-primary fw-bold" style="letter-spacing: -0.05em;">Sanly Shop</h1>
            <nav class="d-flex align-items-center gap-2 gap-md-4">
                <a href="{% url 'home' %}" class="nav-link px-2 small fw-bold">ESASY</a>
                <a href="{% url 'image_search' %}" class="nav-link px-2 small fw-bold">GÖZLEG</a>
                <a href="{% url 'product_list' %}" class="btn btn-premium btn-sm ms-2 shadow-sm">HARYTLAR</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center mt-5">
        <div class="container">
            <p>&copy; 2026 Electron Bazar. Sanly-shop tarapyndan goldanylýar.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>

</html>
